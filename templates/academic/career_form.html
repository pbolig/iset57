{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto mt-10 bg-white p-8 rounded-xl shadow border border-gray-100">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">
        {% if object %}Editar Carrera{% else %}Nueva Carrera{% endif %}
    </h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="space-y-4">
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" 
                       name="{{ field.name }}" 
                       value="{{ field.value|default:'' }}"
                       class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-orange-500 focus:border-orange-500 border p-2">
                {% if field.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
        </div>

        <div class="mt-6 flex gap-3">
            <button type="submit" class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700">Guardar</button>
            <a href="{% url 'academic:career_list' %}" class="bg-gray-100 text-gray-600 px-4 py-2 rounded hover:bg-gray-200">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
