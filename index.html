<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISET N° 57</title>
<meta name="description" content="Instituto Superior de Educación Técnica N° 57. Institución pública de formación terciaria.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14213d; --celeste:#74acdf; --celeste-suave:#e6f0fa; --sol:#f6b40e;
  --fondo:#f5f8fb; --papel:#ffffff; --texto:#1f2a3d; --suave:#56647a; --borde:#d3dde9;
  --alerta:#b3261e; --radio:10px;
  --f-titulo:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-texto:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:400 1.0625rem/1.6 var(--f-texto);
  overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;overflow-wrap:anywhere}
img,canvas,svg{max-width:100%}
a{color:var(--tinta)}
:focus-visible{outline:3px solid var(--sol);outline-offset:3px;border-radius:4px}
.saltar{position:absolute;left:-999px;top:0;background:var(--sol);color:var(--tinta);padding:.6rem 1rem;z-index:10;font-weight:700}
.saltar:focus{left:0}
.wrap{width:min(1100px,100%);margin-inline:auto;
  padding-inline:max(1.25rem,env(safe-area-inset-left)) max(1.25rem,env(safe-area-inset-right))}

/* Hero */
header{background:var(--tinta);color:#fff;border-bottom:8px solid var(--celeste)}
.hero{text-align:center;padding-top:max(clamp(2.5rem,7vw,5rem),calc(env(safe-area-inset-top) + 1.5rem));padding-bottom:clamp(2rem,5vw,3.5rem)}
.hero .tipo{margin:0 0 .5rem;color:var(--celeste);font-weight:700}
.hero h1{margin:0;font:800 clamp(2.1rem,7.5vw,4.5rem)/1.05 var(--f-titulo);letter-spacing:-.02em}
.hero .lema{max-width:34ch;margin:1.25rem auto 0;font-size:clamp(1.05rem,2.4vw,1.4rem);color:#dbe6f3}
nav{margin-top:2rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
nav a{display:inline-flex;align-items:center;min-height:44px;color:#fff;text-decoration:none;padding:.5rem 1.1rem;border:2px solid rgba(255,255,255,.4);border-radius:999px;font-weight:700;animation:sutilFlotar 4s ease-in-out infinite}
nav a:nth-child(2){animation-delay:.6s}
nav a:nth-child(3){animation-delay:1.2s}
nav a:hover{background:#fff;color:var(--tinta)}

/* Secciones */
main section{padding:clamp(2.5rem,6vw,4rem) 0}
h2{margin:0 0 .5rem;text-align:center;font:800 clamp(1.7rem,6vw,2.4rem)/1.1 var(--f-titulo);color:var(--tinta)}
.intro{margin:0 auto 2rem;text-align:center;color:var(--suave);max-width:60ch}

/* Novedades */
.avisos{display:grid;gap:1.25rem}
.aviso{background:var(--papel);border:1px solid var(--borde);border-left:8px solid var(--celeste);border-radius:var(--radio);padding:1.25rem 1.5rem}
.aviso.importante{border-left-color:var(--alerta)}
.aviso.fecha{border-left-color:var(--sol)}
.aviso.info{border-left-color:var(--celeste)}
.aviso-header{display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.badge-espacio{display:inline-block;padding:.2rem .7rem;border-radius:999px;font:700 .82rem var(--f-texto);color:#fff;background:var(--celeste)}
.aviso h3{margin:0;text-align:center;font:800 1.3rem/1.2 var(--f-titulo);color:var(--tinta)}
.aviso p{margin:.4rem 0;max-width:70ch}
.aviso ul{margin:.4rem 0;padding-left:1.2rem}
.nota{color:var(--suave);font-size:.95rem}
.tabla-wrap{overflow-x:auto;margin:.75rem 0;border:1px solid var(--borde);border-radius:8px;background:var(--papel)}
.tabla-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;padding:.7rem 1rem;background:var(--celeste-suave);border-bottom:1px solid var(--borde)}
.tabla-toolbar-title{font:800 1rem var(--f-titulo);color:var(--tinta);margin:0}
.tabla-filtro{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--tinta);font-weight:700}
.tabla-select{padding:.35rem .85rem;border:1px solid var(--borde);border-radius:999px;background:#fff;color:var(--tinta);font:700 .86rem var(--f-texto);cursor:pointer;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
.tabla-select:focus{border-color:var(--tinta);box-shadow:0 0 0 2px var(--celeste)}
.badge-carrera{display:inline-flex;align-items:center;justify-content:center;padding:.22rem .85rem;border-radius:999px;font:700 .84rem var(--f-texto);color:#fff;background:var(--c,#14213d);white-space:nowrap;box-shadow:0 1px 3px rgba(20,33,61,.12);letter-spacing:.01em}
.badge-carrera.dark-text{color:var(--tinta)}
.tabla-vacia{text-align:center;padding:1.5rem;color:var(--suave);font-style:italic}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:.98rem}
th,td{text-align:left;padding:.65rem .9rem;border-top:1px solid var(--borde)}
thead th{background:var(--tinta);color:#fff;border-top:0}
tbody tr:nth-child(even){background:var(--fondo)}
.enlace{display:flex;align-items:center;justify-content:center;width:fit-content;max-width:100%;min-height:44px;margin:1rem auto 0;padding:.5rem 1.4rem;background:var(--tinta);color:#fff;border-radius:999px;font-weight:700;text-decoration:none;text-align:center;animation:sutilFlotar 3.5s ease-in-out infinite;animation-delay:.3s}

/* Oferta */
.oferta{background:var(--celeste-suave)}
.cards{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr))}
.card{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:1.25rem;align-items:stretch;background:var(--papel);border:1px solid var(--borde);border-top:8px solid var(--c,var(--celeste));border-radius:var(--radio);padding:1.4rem}
.card:hover{border-color:var(--tinta);box-shadow:0 6px 16px rgba(20,33,61,.12)}
.card-info{display:flex;flex-direction:column;justify-content:space-between;gap:.75rem}
.card h3{margin:0;font:800 1.3rem/1.18 var(--f-titulo)}
.card h3 a{text-decoration:none;color:var(--tinta)}
.card h3 a:hover{color:var(--celeste)}
.card p{margin:0;color:var(--suave);font-size:.95rem}

/* Carrusel dentro de la card */
.card-carousel-box{position:relative;width:100%;min-height:170px;border-radius:8px;overflow:hidden;background:var(--tinta);box-shadow:0 3px 10px rgba(20,33,61,.15);display:flex}
.carousel-track{position:relative;width:100%;height:100%;min-height:170px;overflow:hidden}
.carousel-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,transform .45s ease;transform:scale(1.03)}
.carousel-slide.active{opacity:1;visibility:visible;transform:scale(1)}
.carousel-slide img,.carousel-slide svg{width:100%;height:100%;object-fit:cover;display:block}
.carousel-nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 .3rem;pointer-events:none;z-index:3}
.carousel-btn{pointer-events:auto;background:rgba(20,33,61,.7);backdrop-filter:blur(3px);color:#fff;border:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;cursor:pointer;transition:all .2s ease;opacity:.85}
.carousel-btn:hover{background:var(--sol);color:var(--tinta);opacity:1;transform:scale(1.1)}
.carousel-dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:4;pointer-events:none}
.carousel-dot{pointer-events:auto;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;cursor:pointer;transition:all .25s ease}
.carousel-dot.active{background:var(--sol);width:16px;border-radius:999px}

/* Hero actions y botón de comunidad */
.hero-actions{margin-top:1.6rem;display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap}
.btn-comunidad-hero{display:inline-flex;align-items:center;gap:.45rem;min-height:46px;padding:.55rem 1.4rem;background:var(--sol);color:var(--tinta);font:800 1rem var(--f-titulo);text-decoration:none;border-radius:999px;box-shadow:0 4px 14px rgba(246,180,14,.35);transition:transform .25s ease,box-shadow .25s ease;animation:sutilFlotar 3.8s ease-in-out infinite}
.btn-comunidad-hero:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 8px 20px rgba(246,180,14,.5);background:#ffc324}
.btn-inscripcion-hero{display:inline-flex;align-items:center;gap:.45rem;min-height:46px;padding:.55rem 1.3rem;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.6);font:700 .95rem var(--f-texto);text-decoration:none;border-radius:999px;transition:all .25s ease}
.btn-inscripcion-hero:hover{background:#fff;color:var(--tinta);border-color:#fff;transform:translateY(-3px)}

/* Movilidad en botones y cards */
@keyframes sutilFlotar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}
nav a,.enlace,.card{transition:transform .28s cubic-bezier(.34,1.5,.64,1),background-color .2s ease,color .2s ease,box-shadow .28s ease,border-color .2s ease}
@media (hover:hover){
  nav a:hover{animation-play-state:paused;transform:translateY(-4px) scale(1.02);box-shadow:0 4px 0 var(--celeste)}
  .enlace:hover{animation-play-state:paused;transform:translateY(-4px) scale(1.02);background:var(--celeste);color:var(--tinta);box-shadow:0 4px 0 var(--tinta)}
  .card:hover{transform:translateY(-4px)}
}
nav a:focus-visible,.enlace:focus-visible{animation-play-state:paused;transform:translateY(-4px)}
.card:focus-within{transform:translateY(-4px);border-color:var(--tinta);box-shadow:0 6px 16px rgba(20,33,61,.15)}
nav a:active,.enlace:active{animation-play-state:paused;transform:translateY(1px) scale(.96);box-shadow:none}
.card:active{transform:scale(.98)}

/* Celulares: sin scroll horizontal, tablas apiladas */
@media(max-width:640px){
  body{font-size:1rem}
  main section{padding:2rem 0}
  .aviso{padding:1rem 1.1rem}
  .cards{grid-template-columns:1fr}
  .card{grid-template-columns:1fr;gap:1rem;padding:1.25rem}
  .card-carousel-box{min-height:190px}
  .tabla-wrap{overflow:visible;border:0}
  table,tbody,tr,td,caption{display:block;width:100%;min-width:0}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  caption{text-align:center;border-radius:8px}
  tr{margin:.6rem 0;overflow:hidden;background:var(--papel);border:1px solid var(--borde);border-radius:8px}
  tbody tr:nth-child(even){background:var(--papel)}
  td{display:grid;grid-template-columns:minmax(0,6.5rem) minmax(0,1fr);gap:.6rem;padding:.5rem .8rem;border-top:1px solid var(--borde)}
  td::before{content:attr(data-label);font-weight:700;color:var(--suave)}
  td:first-child{grid-template-columns:1fr;border-top:0;background:var(--celeste-suave);font-weight:700}
  td:first-child::before{content:none}
}

footer{background:var(--tinta);color:#dbe6f3;padding:2rem 0 max(2rem,calc(env(safe-area-inset-bottom) + 1rem));font-size:.98rem;text-align:center}
footer a{color:#fff}
footer p{margin:.2rem 0}
.error{background:#fff3f2;border:2px solid var(--alerta);border-radius:var(--radio);padding:1rem 1.25rem}

/* Modal y Planes de Estudio */
.oferta-acciones{margin-top:2.2rem;display:flex;justify-content:center}
.btn-plan-modal{border:none;cursor:pointer;font-size:1rem;background:var(--tinta);color:#fff;box-shadow:0 4px 14px rgba(20,33,61,.25)}
.card-btn-plan{display:inline-flex;align-items:center;gap:.3rem;margin-top:.75rem;font-size:.86rem;font-weight:700;color:var(--tinta);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0}
.card-btn-plan:hover{color:var(--celeste)}
.modal-dialog{border:none;border-radius:12px;padding:0;max-width:980px;width:min(95vw,980px);background:var(--papel);box-shadow:0 20px 45px rgba(20,33,61,.35);color:var(--texto)}
.modal-dialog::backdrop{background:rgba(20,33,61,.65);backdrop-filter:blur(3px)}
.modal-content{display:flex;flex-direction:column;max-height:88vh}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;background:var(--tinta);color:#fff;border-bottom:4px solid var(--c-active,var(--celeste))}
.modal-sub{margin:0 0 .2rem;font-size:.82rem;color:var(--celeste);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.modal-title{margin:0;font:800 1.35rem var(--f-titulo);color:#fff}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;transition:background .2s ease}
.modal-close:hover{background:var(--sol);color:var(--tinta)}
.modal-body{padding:1.25rem 1.5rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.1rem}
.modal-tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tab-btn{padding:.5rem 1.1rem;border-radius:999px;border:2px solid var(--borde);background:var(--fondo);color:var(--tinta);font:700 .9rem var(--f-texto);cursor:pointer;transition:all .2s ease}
.tab-btn:hover{border-color:var(--tinta)}
.tab-btn.active{background:var(--c-tab,var(--tinta));color:#fff;border-color:var(--c-tab,var(--tinta))}
.modal-filters{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;background:var(--celeste-suave);padding:.75rem 1rem;border-radius:8px}
.filter-group{display:inline-flex;align-items:center;gap:.5rem;font-size:.88rem;font-weight:700;color:var(--tinta)}
.filter-search{flex:1;min-width:220px}
.input-search{width:100%;padding:.4rem .85rem;border:1px solid var(--borde);border-radius:999px;font:400 .9rem var(--f-texto);background:#fff;outline:none}
.input-search:focus{border-color:var(--tinta);box-shadow:0 0 0 2px var(--celeste)}
.modal-table-wrap{border:1px solid var(--borde);border-radius:8px;overflow-x:auto}
.badge-comision{display:inline-block;padding:.15rem .45rem;border-radius:4px;background:var(--celeste-suave);color:var(--tinta);font-weight:700;font-size:.78rem;margin-right:.2rem}
.badge-correlativa{display:inline-block;padding:.2rem .55rem;border-radius:6px;background:var(--fondo);border:1px solid var(--borde);font-size:.8rem;margin:.15rem .25rem .15rem 0;color:var(--texto)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
  nav a,.enlace,.card,.qr{transform:none!important}
}
</style>
</head>
<body>
<a class="saltar" href="#novedades">Saltar al contenido</a>

<header>
  <div class="wrap hero">
    <p class="tipo" id="h-tipo"></p>
    <h1 id="h-nombre">ISET N° 57</h1>
    <p class="lema" id="h-lema"></p>
    <div class="hero-actions">
      <a href="comunidad.html" class="btn-comunidad-hero">🌟 Comunidad &amp; Blog de Carreras</a>
      <a href="inscripcion.html" class="btn-inscripcion-hero">📝 Guía de Inscripción</a>
    </div>
    <nav aria-label="Secciones">
      <a href="#novedades">Novedades</a>

      <a href="comunidad.html">Comunidad</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <section id="novedades" aria-labelledby="t-nov">
    <div class="wrap">
      <h2 id="t-nov">Novedades</h2>
      <p class="intro" id="i-nov"></p>
      <div class="avisos" id="avisos" aria-live="polite"><p>Cargando información…</p></div>
    </div>
  </section>

  <section id="oferta" class="oferta" aria-labelledby="t-of">
    <div class="wrap">
      <h2 id="t-of">Oferta académica</h2>
      <p class="intro" id="i-of"></p>
      <div class="cards" id="cards"></div>
      <div class="oferta-acciones">
        <button type="button" class="enlace btn-plan-modal" id="btn-abrir-plan">📋 Ver Planes de Estudio y Correlatividades</button>
      </div>
    </div>
  </section>
</main>

<dialog id="modal-plan" class="modal-dialog" aria-labelledby="modal-plan-title">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <p class="modal-sub">ISET N° 57 · Planes Oficiales</p>
        <h3 id="modal-plan-title" class="modal-title">Planes de Estudio y Correlatividades</h3>
      </div>
      <button type="button" class="modal-close" id="btn-cerrar-modal" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-tabs" id="plan-tabs"></div>
      <div class="modal-filters">
        <div class="filter-group">
          <label for="filtro-plan-anio">Año:</label>
          <select id="filtro-plan-anio" class="tabla-select">
            <option value="todos">Todos los años</option>
            <option value="1">1° Año</option>
            <option value="2">2° Año</option>
            <option value="3">3° Año</option>
          </select>
        </div>
        <div class="filter-group filter-search">
          <label for="filtro-plan-buscar">Buscar:</label>
          <input type="search" id="filtro-plan-buscar" class="input-search" placeholder="Materia o código (ej: Programación, 1INCOM)...">
        </div>
      </div>
      <div class="modal-table-wrap" id="modal-table-container"></div>
    </div>
  </div>
</dialog>

<footer id="contacto">
  <div class="wrap" id="pie"></div>
</footer>

<script>
(() => {
  "use strict";

  // Crea elementos de forma segura (todo texto entra como textContent, nunca como HTML)
  const h = (tag, attrs = {}, ...hijos) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") {
        n.className = v;
      } else if (k.startsWith("on") && typeof v === "function") {
        n.addEventListener(k.slice(2).toLowerCase(), v);
      } else {
        n.setAttribute(k, v);
      }
    }
    hijos.flat().forEach(c => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); });
    return n;
  };
  const $ = id => document.getElementById(id);
  const urlAbsoluta = ruta => new URL(ruta, document.baseURI).href;

  function buscarColorCarrera(nombreCarrera, espacios = []) {
    if (!nombreCarrera) return { color: "#14213d", darkText: false };
    const norm = String(nombreCarrera).toLowerCase().trim();
    const esp = espacios.find(e => {
      const t = (e.titulo || "").toLowerCase();
      const tc = (e.tituloCorto || "").toLowerCase();
      const id = (e.id || "").toLowerCase();
      return norm.includes(tc) || norm.includes(id) || t.includes(norm) || norm.includes(t);
    });
    const color = (esp && esp.color) ? esp.color : "#14213d";
    const darkText = color.toLowerCase() === "#f6b40e";
    return { color, darkText };
  }

  // Tabla interactiva: ordenada por Carrera y Fecha, con badges de color y filtro
  function tabla(t, d) {
    const espacios = (d && d.ofertaAcademica && d.ofertaAcademica.espacios) || [];
    const cols = t.columnas || [];
    const idxCarrera = cols.findIndex(c => c.toLowerCase().includes("carrera"));
    const idxFecha = cols.findIndex(c => c.toLowerCase().includes("fecha"));

    // Ordenar automáticamente por Carrera y luego por Fecha
    const filasOriginales = (t.filas || []).map(f => [...f]);
    filasOriginales.sort((a, b) => {
      if (idxCarrera !== -1) {
        const cA = String(a[idxCarrera] || "");
        const cB = String(b[idxCarrera] || "");
        const cmpC = cA.localeCompare(cB, "es", { sensitivity: "base" });
        if (cmpC !== 0) return cmpC;
      }
      if (idxFecha !== -1) {
        const fA = String(a[idxFecha] || "");
        const fB = String(b[idxFecha] || "");
        return fA.localeCompare(fB, "es", { sensitivity: "base" });
      }
      return 0;
    });

    const celda = (valor, colIdx) => {
      if (colIdx === idxCarrera) {
        const infoColor = buscarColorCarrera(valor, espacios);
        const spanClass = "badge-carrera" + (infoColor.darkText ? " dark-text" : "");
        return h("span", { class: spanClass, style: "--c:" + infoColor.color }, valor);
      }
      return valor;
    };

    const tbody = h("tbody");
    const renderFilas = (filas) => {
      if (!filas.length) {
        tbody.replaceChildren(
          h("tr", {}, h("td", { colspan: cols.length || 1, class: "tabla-vacia" }, "No hay materias programadas para la carrera seleccionada."))
        );
        return;
      }
      tbody.replaceChildren(
        ...filas.map(f =>
          h("tr", { "data-carrera": idxCarrera !== -1 ? String(f[idxCarrera]) : "" },
            f.map((c, i) => h("td", { "data-label": cols[i] }, celda(c, i)))
          )
        )
      );
    };

    renderFilas(filasOriginales);

    let toolbar = null;
    if (idxCarrera !== -1) {
      const carrerasUnicas = [...new Set(filasOriginales.map(f => String(f[idxCarrera]).trim()))].filter(Boolean);
      const select = h("select", { class: "tabla-select", "aria-label": "Filtrar por carrera" },
        h("option", { value: "todas" }, "Todas las carreras (" + filasOriginales.length + ")"),
        ...carrerasUnicas.map(c => {
          const count = filasOriginales.filter(f => String(f[idxCarrera]).trim() === c).length;
          return h("option", { value: c }, c + " (" + count + ")");
        })
      );

      select.addEventListener("change", (e) => {
        const sel = e.target.value;
        if (sel === "todas") {
          renderFilas(filasOriginales);
        } else {
          renderFilas(filasOriginales.filter(f => String(f[idxCarrera]).trim() === sel));
        }
      });

      toolbar = h("div", { class: "tabla-toolbar" },
        t.titulo ? h("h4", { class: "tabla-toolbar-title" }, t.titulo) : h("span"),
        h("div", { class: "tabla-filtro" },
          h("label", {}, "Carrera:"),
          select
        )
      );
    } else if (t.titulo) {
      toolbar = h("div", { class: "tabla-toolbar" },
        h("h4", { class: "tabla-toolbar-title" }, t.titulo)
      );
    }

    const tableEl = h("table", {},
      h("thead", {}, h("tr", {}, cols.map(c => h("th", { scope: "col" }, c)))),
      tbody
    );

    return h("div", { class: "tabla-wrap", role: "region", "aria-label": t.titulo || "Tabla", tabindex: "0" },
      toolbar,
      tableEl
    );
  }

  // "contenido" puede ser: string | array de strings (lista) | objeto tabla | array mixto
  function contenido(c, d) {
    if (typeof c === "string") return [h("p", {}, c)];
    if (Array.isArray(c)) {
      if (c.every(x => typeof x === "string")) return [h("ul", {}, c.map(x => h("li", {}, x)))];
      return c.flatMap(item => contenido(item, d));
    }
    if (c && c.columnas) return [tabla(c, d)];
    return [];
  }

  function resolverAviso(a, d) {
    const ig = d.inscripcionGeneral || {};
    if (a.tipo === "auto_inscripcion") {
      const p = (ig.periodos && ig.periodos[0]) || {};
      const reqList = (ig.requisitosComunes || []).map(r => typeof r === "string" ? r : r.item);
      const reqTxt = reqList.slice(0, 4).join(", ") + (reqList.length > 4 ? " y más." : ".");
      return {
        tipo: "fecha",
        espacioId: a.espacioId || "general",
        titulo: "Inscripciones ciclo lectivo " + (ig.ciclo || "2027"),
        contenido: (p.fechas ? p.fechas + ", " : "") + (p.horario ? p.horario + ", " : "") + "en Secretaría del Instituto. Presentar " + reqTxt,
        nota: a.nota || "Consultá el cronograma completo, etapas de febrero y requisitos detallados en la página de inscripción.",
        enlace: a.enlace || { texto: "Ver requisitos y fechas de inscripción", url: "inscripcion.html" }
      };
    }
    if (a.tipo === "auto_propedeutico") {
      const prop = ig.propedeutico || {};
      return {
        tipo: "info",
        espacioId: a.espacioId || "general",
        titulo: "Curso propedéutico",
        contenido: [
          prop.inicio ? "Inicio: " + prop.inicio : null,
          prop.modalidad ? "Modalidad: " + prop.modalidad : null,
          prop.duracion ? "Duración: " + prop.duracion : null,
          prop.nota || "Obligatorio para todas las tecnicaturas"
        ].filter(Boolean),
        nota: a.nota || null,
        enlace: a.enlace || null
      };
    }
    return a;
  }

  function aviso(rawAviso, d) {
    const a = resolverAviso(rawAviso, d);
    let badge = null;
    if (a.espacioId && a.espacioId !== "general" && d.ofertaAcademica && d.ofertaAcademica.espacios) {
      const espacio = d.ofertaAcademica.espacios.find(e => e.id === a.espacioId);
      if (espacio) {
        badge = h("span", {
          class: "badge-espacio",
          style: espacio.color ? "background-color:" + espacio.color : null
        }, espacio.titulo.replace(/^Tecnicatura Superior en\s+|^Tecnicatura en\s+/i, ""));
      }
    }

    return h("article", { class: "aviso " + (a.tipo || "info") },
      h("div", { class: "aviso-header" },
        badge,
        h("h3", {}, a.titulo)
      ),
      contenido(a.contenido, d),
      a.nota ? h("p", { class: "nota" }, a.nota) : null,
      a.enlace ? h("a", { class: "enlace", href: a.enlace.url }, a.enlace.texto) : null
    );
  }

  function setupModalPlanes(espacios) {
    const dialog = $("modal-plan");
    const btnAbrir = $("btn-abrir-plan");
    const btnCerrar = $("btn-cerrar-modal");
    const tabsContainer = $("plan-tabs");
    const selectAnio = $("filtro-plan-anio");
    const inputBuscar = $("filtro-plan-buscar");
    const tableContainer = $("modal-table-container");

    const carrerasConMaterias = espacios.filter(e => e.materiasDetalladas && e.materiasDetalladas.length);
    if (!carrerasConMaterias.length) {
      if (btnAbrir) btnAbrir.style.display = "none";
      return;
    }

    let activeCareerId = carrerasConMaterias[0].id;

    function renderTabs() {
      tabsContainer.replaceChildren(...carrerasConMaterias.map(c => {
        const btn = h("button", {
          type: "button",
          class: "tab-btn" + (c.id === activeCareerId ? " active" : ""),
          style: "--c-tab:" + (c.color || "var(--tinta)")
        }, c.tituloCorto || c.titulo.replace(/^Tecnicatura Superior en\s+/i, ""));
        btn.addEventListener("click", () => {
          activeCareerId = c.id;
          renderTabs();
          renderTabla();
        });
        return btn;
      }));
    }

    function renderTabla() {
      const currentEsp = carrerasConMaterias.find(e => e.id === activeCareerId) || carrerasConMaterias[0];
      dialog.style.setProperty("--c-active", currentEsp.color || "var(--celeste)");

      const anioFiltro = selectAnio.value;
      const busqueda = (inputBuscar.value || "").toLowerCase().trim();

      let materias = currentEsp.materiasDetalladas || [];

      if (anioFiltro !== "todos") {
        materias = materias.filter(m => String(m.anio).trim() === anioFiltro);
      }

      if (busqueda) {
        materias = materias.filter(m => 
          (m.nombre && m.nombre.toLowerCase().includes(busqueda)) ||
          (m.codigo && m.codigo.toLowerCase().includes(busqueda)) ||
          (m.correlativas && m.correlativas.some(cr => cr.toLowerCase().includes(busqueda)))
        );
      }

      if (!materias.length) {
        tableContainer.replaceChildren(
          h("div", { class: "tabla-vacia" }, "No se encontraron materias con los filtros seleccionados.")
        );
        return;
      }

      const thead = h("thead", {},
        h("tr", {},
          h("th", { scope: "col" }, "Año"),
          h("th", { scope: "col" }, "Cód."),
          h("th", { scope: "col" }, "Materia"),
          h("th", { scope: "col" }, "Horas"),
          h("th", { scope: "col" }, "Comisiones"),
          h("th", { scope: "col" }, "Correlatividades Previas")
        )
      );

      const tbody = h("tbody", {},
        materias.map(m => {
          const comisionesBadges = (m.comisiones && m.comisiones.length)
            ? m.comisiones.map(com => {
                const doc = (m.docentes && m.docentes[com]) ? m.docentes[com] : "";
                if (doc) {
                  return h("span", { class: "badge-comision", title: "Docente: " + doc },
                    h("strong", {}, "Com. " + com + ": "),
                    doc
                  );
                }
                return h("span", { class: "badge-comision" }, "Com. " + com);
              })
            : h("span", { style: "color:var(--suave)" }, "—");

          const correlativasBadges = (m.correlativas && m.correlativas.length)
            ? m.correlativas.map(corr => h("span", { class: "badge-correlativa" }, corr))
            : h("span", { style: "color:var(--suave);font-size:.84rem" }, "Sin correlativas");

          return h("tr", {},
            h("td", { "data-label": "Año", style: "font-weight:700" }, m.anio + "°"),
            h("td", { "data-label": "Código", style: "font-family:monospace;font-weight:700;color:var(--suave)" }, m.codigo || "—"),
            h("td", { "data-label": "Materia", style: "font-weight:700;color:var(--tinta)" }, m.nombre),
            h("td", { "data-label": "Carga Horaria" }, (m.cargaHoraria ? m.cargaHoraria + " mód." : "—")),
            h("td", { "data-label": "Comisiones" }, comisionesBadges),
            h("td", { "data-label": "Correlativas" }, correlativasBadges)
          );
        })
      );

      tableContainer.replaceChildren(
        h("table", {}, thead, tbody)
      );
    }

    if (btnAbrir) {
      btnAbrir.addEventListener("click", () => {
        renderTabs();
        renderTabla();
        dialog.showModal();
      });
    }

    if (btnCerrar) {
      btnCerrar.addEventListener("click", () => dialog.close());
    }

    dialog.addEventListener("click", (e) => {
      if (e.target === dialog) dialog.close();
    });

    selectAnio.addEventListener("change", renderTabla);
    inputBuscar.addEventListener("input", renderTabla);

    window.abrirModalPlanCarrera = (carreraId) => {
      if (carrerasConMaterias.some(c => c.id === carreraId)) {
        activeCareerId = carreraId;
      }
      renderTabs();
      renderTabla();
      dialog.showModal();
    };
  }

  function crearCarrusel(imagenes = [], color = "#74acdf", enlace = "#") {
    const box = h("div", { class: "card-carousel-box", style: "--c-car:" + color });
    
    // Si no hay imágenes configuradas, provee una por defecto
    if (!imagenes.length) {
      imagenes = [{ src: "img/carrera/td/carrusel/1.svg", alt: "ISET N° 57" }];
    }

    const track = h("div", { class: "carousel-track" });
    const slides = imagenes.map((imgObj, idx) => {
      const src = typeof imgObj === "string" ? imgObj : imgObj.src;
      const alt = (typeof imgObj === "object" && imgObj.alt) ? imgObj.alt : "Foto institucional";
      const slide = h("div", { 
        class: "carousel-slide" + (idx === 0 ? " active" : ""), 
        "data-index": idx,
        role: "group",
        "aria-label": `${idx + 1} de ${imagenes.length}: ${alt}`
      },
        h("a", { href: enlace, title: "Ver carrera: " + alt, style: "display:block;width:100%;height:100%" },
          h("img", { src: src, alt: alt, loading: "lazy" })
        )
      );
      return slide;
    });
    track.append(...slides);

    let currentIndex = 0;
    let timer = null;
    let dots = [];

    const irA = (n) => {
      currentIndex = (n + imagenes.length) % imagenes.length;
      slides.forEach((s, i) => s.classList.toggle("active", i === currentIndex));
      dots.forEach((d, i) => d.classList.toggle("active", i === currentIndex));
    };

    const siguiente = () => irA(currentIndex + 1);
    const anterior = () => irA(currentIndex - 1);

    const iniciarAuto = () => {
      if (imagenes.length > 1 && !timer) {
        timer = setInterval(siguiente, 4500);
      }
    };
    const pausarAuto = () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    };

    box.addEventListener("mouseenter", pausarAuto);
    box.addEventListener("mouseleave", iniciarAuto);
    box.addEventListener("focusin", pausarAuto);
    box.addEventListener("focusout", iniciarAuto);

    box.append(track);

    if (imagenes.length > 1) {
      const btnPrev = h("button", {
        type: "button",
        class: "carousel-btn",
        "aria-label": "Foto anterior",
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); anterior(); }
      }, "❮");

      const btnNext = h("button", {
        type: "button",
        class: "carousel-btn",
        "aria-label": "Foto siguiente",
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); siguiente(); }
      }, "❯");

      const nav = h("div", { class: "carousel-nav" }, btnPrev, btnNext);
      box.append(nav);

      const dotsWrap = h("div", { class: "carousel-dots" });
      dots = imagenes.map((_, idx) => h("button", {
        type: "button",
        class: "carousel-dot" + (idx === 0 ? " active" : ""),
        "aria-label": `Ir a foto ${idx + 1}`,
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); irA(idx); }
      }));
      dotsWrap.append(...dots);
      box.append(dotsWrap);

      iniciarAuto();
    }

    return box;
  }

  function card(c) {
    const destino = c.enlace;
    const btnPlan = (c.materiasDetalladas && c.materiasDetalladas.length)
      ? h("button", {
          type: "button",
          class: "card-btn-plan",
          onclick: (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (window.abrirModalPlanCarrera) window.abrirModalPlanCarrera(c.id);
          }
        }, "📋 Ver correlatividades")
      : null;

    const carruselElem = crearCarrusel(c.carrusel || [], c.color, destino);

    const info = h("div", { class: "card-info" },
      h("div", {},
        h("h3", {}, h("a", { href: destino }, c.titulo)),
        h("p", {}, c.descripcion)
      ),
      h("div", {},
        btnPlan
      )
    );

    const art = h("article", { class: "card", style: c.color ? "--c:" + c.color : null },
      info,
      carruselElem
    );
    return art;
  }

  function render(d) {
    const i = d.institucion, g = d.informacionGeneral, o = d.ofertaAcademica;
    document.title = i.nombre + (i.nombreLargo ? " – " + i.nombreLargo : "");
    $("h-nombre").textContent = i.nombre;
    $("h-tipo").textContent = i.nombreLargo || "";
    $("h-lema").textContent = i.lema || "";
    $("t-nov").textContent = g.titulo || "Novedades";
    $("i-nov").textContent = g.introduccion || "";
    $("avisos").replaceChildren(...g.avisos.map(a => aviso(a, d)));
    $("t-of").textContent = o.titulo || "Oferta académica";
    $("i-of").textContent = o.introduccion || "";
    $("cards").replaceChildren(...o.espacios.map(card));
    setupModalPlanes(o.espacios);
    const c = i.contacto || {};
    $("pie").replaceChildren(
      h("p", {}, h("strong", {}, i.nombre + " · " + (i.gestion || ""))),
      c.direccion ? h("p", {}, c.direccion) : null,
      c.telefono ? h("p", {}, "Tel.: " + c.telefono) : null,
      c.email ? h("p", {}, "Correo: ", h("a", { href: "mailto:" + c.email }, c.email)) : null,
      c.horario ? h("p", {}, "Atención: " + c.horario) : null
    );
  }

  Promise.all([
    fetch("data.json?_t=" + Date.now(), { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
    fetch("materias.json?_t=" + Date.now(), { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null)
  ])
    .then(([data, materias]) => {
      if (materias && data && data.ofertaAcademica && data.ofertaAcademica.espacios) {
        data.ofertaAcademica.espacios.forEach(esp => {
          if (materias[esp.id]) esp.materiasDetalladas = materias[esp.id];
        });
      }
      render(data);
    })
    .catch(err => {
      console.error(err);
      $("avisos").replaceChildren(h("div", { class: "error", role: "alert" },
        "No pudimos cargar la información. Probá recargar la página en unos minutos."));
    });
})();
</script>
</body>
</html>
