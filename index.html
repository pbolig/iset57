<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISET N° 57</title>
<meta name="description" content="Instituto Superior de Educación Técnica N° 57. Institución pública de formación terciaria.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-editor.css">
<style>
:root{
  --tinta:#14213d; --celeste:#74acdf; --celeste-suave:#e6f0fa; --sol:#f6b40e;
  --fondo:#f5f8fb; --papel:#ffffff; --texto:#1f2a3d; --suave:#56647a; --borde:#d3dde9;
  --alerta:#b3261e; --radio:10px;
  --f-titulo:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-texto:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:400 1.0625rem/1.6 var(--f-texto);
  overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;overflow-wrap:anywhere}
img,canvas,svg{max-width:100%}
a{color:var(--tinta)}
:focus-visible{outline:3px solid var(--sol);outline-offset:3px;border-radius:4px}
.saltar{position:absolute;left:-999px;top:0;background:var(--sol);color:var(--tinta);padding:.6rem 1rem;z-index:10;font-weight:700}
.saltar:focus{left:0}
.wrap{width:min(1100px,100%);margin-inline:auto;
  padding-inline:max(1.25rem,env(safe-area-inset-left)) max(1.25rem,env(safe-area-inset-right))}

/* Hero */
header{background:var(--tinta);color:#fff;border-bottom:8px solid var(--celeste)}
.hero{text-align:center;padding-top:max(clamp(2.5rem,7vw,5rem),calc(env(safe-area-inset-top) + 1.5rem));padding-bottom:clamp(2rem,5vw,3.5rem)}
.hero .tipo{margin:0 0 .5rem;color:var(--celeste);font-weight:700}
.hero h1{margin:0;font:800 clamp(2.1rem,7.5vw,4.5rem)/1.05 var(--f-titulo);letter-spacing:-.02em}
.hero-logo-wrap{margin:.4rem auto;display:flex;justify-content:center;align-items:center}
.hero-logo{max-width:min(90vw,440px);width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25));transition:transform .35s cubic-bezier(0.2,0.8,0.25,1),filter .35s ease}
.hero-logo:hover{transform:scale(1.02);filter:drop-shadow(0 6px 18px rgba(0,0,0,.3))}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hero .lema{max-width:36ch;margin:1rem auto 0;font-size:clamp(1.05rem,2.4vw,1.35rem);color:#dbe6f3}
nav{margin-top:2rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
nav a{display:inline-flex;align-items:center;min-height:44px;color:#fff;text-decoration:none;padding:.5rem 1.15rem;border:2px solid rgba(255,255,255,.4);border-radius:999px;font-weight:700;transition:transform .28s cubic-bezier(.34,1.5,.64,1),background-color .2s ease,color .2s ease,box-shadow .28s ease,border-color .2s ease}
nav a:hover{background:#fff;color:var(--tinta);border-color:#fff;transform:translateY(-4px) scale(1.03);box-shadow:0 8px 20px rgba(0,0,0,.25)}

/* Secciones */
main section{padding:clamp(2.5rem,6vw,4rem) 0}
h2{margin:0 0 .5rem;text-align:center;font:800 clamp(1.7rem,6vw,2.4rem)/1.1 var(--f-titulo);color:var(--tinta)}
.intro{margin:0 auto 2rem;text-align:center;color:var(--suave);max-width:60ch}

/* Novedades */
.avisos{display:grid;gap:1.25rem}
.aviso{position:relative;background:var(--papel);border:1px solid var(--borde);border-left:8px solid var(--celeste);border-radius:var(--radio);padding:1.35rem 1.6rem;transition:transform .28s cubic-bezier(.34,1.5,.64,1),box-shadow .28s ease,border-color .25s ease}
.aviso:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(20,33,61,.1);border-color:rgba(20,33,61,.28)}
.aviso.importante{border-left-color:var(--alerta)}
.aviso.importante:hover{box-shadow:0 10px 24px rgba(179,38,30,.12);border-color:var(--alerta)}
.aviso.fecha{border-left-color:var(--sol)}
.aviso.fecha:hover{box-shadow:0 10px 24px rgba(246,180,14,.18);border-color:var(--sol)}
.aviso.info{border-left-color:var(--celeste)}
.aviso.info:hover{box-shadow:0 10px 24px rgba(116,172,223,.18);border-color:var(--celeste)}
.aviso-header{display:flex;align-items:center;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.aviso-icono{width:38px;height:38px;object-fit:contain;flex-shrink:0;display:inline-block;transform-origin:center center;filter:drop-shadow(0 3px 6px rgba(20,33,61,.14)) drop-shadow(0 0 8px rgba(116,172,223,.25));animation:megafonoSutil 4.2s ease-in-out infinite;transition:transform .3s cubic-bezier(.34,1.5,.64,1),filter .3s ease}
.aviso.importante .aviso-icono{--c-icono-sombra:rgba(179,38,30,.28)}
.aviso.fecha .aviso-icono{--c-icono-sombra:rgba(246,180,14,.32)}
.aviso.info .aviso-icono{--c-icono-sombra:rgba(116,172,223,.3)}
.aviso:hover .aviso-icono{animation-play-state:paused;transform:scale(1.15) translateY(-2px) rotate(-6deg);filter:drop-shadow(0 6px 14px rgba(20,33,61,.22)) drop-shadow(0 0 14px var(--c-icono-sombra,rgba(116,172,223,.45)))}

@keyframes megafonoSutil{
  0%,100%{transform:translateY(0) rotate(0deg);filter:drop-shadow(0 3px 6px rgba(20,33,61,.14)) drop-shadow(0 0 7px var(--c-icono-sombra,rgba(116,172,223,.22)))}
  25%{transform:translateY(-2.5px) rotate(-3.5deg);filter:drop-shadow(0 6px 11px rgba(20,33,61,.18)) drop-shadow(0 0 13px var(--c-icono-sombra,rgba(116,172,223,.38)))}
  50%{transform:translateY(0) rotate(2deg);filter:drop-shadow(0 3px 6px rgba(20,33,61,.14)) drop-shadow(0 0 7px var(--c-icono-sombra,rgba(116,172,223,.22)))}
  75%{transform:translateY(-1.5px) rotate(-1.5deg);filter:drop-shadow(0 5px 9px rgba(20,33,61,.16)) drop-shadow(0 0 10px var(--c-icono-sombra,rgba(116,172,223,.3)))}
}

@media (prefers-reduced-motion:reduce){
  .aviso-icono{animation:none}
}
.badge-espacio{display:inline-block;padding:.2rem .7rem;border-radius:999px;font:700 .82rem var(--f-texto);color:#fff;background:var(--celeste);box-shadow:0 1px 3px rgba(20,33,61,.12)}
.aviso-img-wrap{margin:1rem auto;text-align:center;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(20,33,61,.08);background:rgba(20,33,61,.02);max-width:100%}
.aviso-img{max-width:100%;max-height:460px;width:auto;height:auto;object-fit:cover;display:block;margin:0 auto;border-radius:10px;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease}
.aviso-img:hover{transform:scale(1.015);box-shadow:0 6px 20px rgba(20,33,61,.14)}
.aviso.aviso-apagado{border-style:dashed;border-left-style:solid;background:rgba(20,33,61,.02);opacity:.85;box-shadow:none}
.aviso.aviso-apagado:hover{opacity:1;box-shadow:0 6px 18px rgba(20,33,61,.08)}
.badge-estado{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .7rem;border-radius:999px;font:700 .8rem var(--f-texto)}
.badge-estado.badge-apagado{color:#b3261e;background:#fee;border:1px solid rgba(179,38,30,.35)}
.badge-fecha{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .7rem;border-radius:999px;font:700 .8rem var(--f-texto);color:var(--suave);background:rgba(20,33,61,.04);border:1px solid rgba(20,33,61,.12)}
.aviso h3{margin:0;text-align:center;font:800 1.3rem/1.2 var(--f-titulo);color:var(--tinta)}
.aviso p{margin:.4rem 0;max-width:70ch}
.aviso ul{margin:.4rem 0;padding-left:1.2rem}
.nota{color:var(--suave);font-size:.95rem}
.tabla-wrap{overflow-x:auto;margin:.75rem 0;border:1px solid var(--borde);border-radius:8px;background:var(--papel)}
.tabla-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;padding:.7rem 1rem;background:var(--celeste-suave);border-bottom:1px solid var(--borde)}
.tabla-toolbar-title{font:800 1rem var(--f-titulo);color:var(--tinta);margin:0}
.tabla-filtro{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--tinta);font-weight:700}
.tabla-select{padding:.35rem .85rem;border:1px solid var(--borde);border-radius:999px;background:#fff;color:var(--tinta);font:700 .86rem var(--f-texto);cursor:pointer;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
.tabla-select:focus{border-color:var(--tinta);box-shadow:0 0 0 2px var(--celeste)}
.badge-carrera{display:inline-flex;align-items:center;justify-content:center;padding:.22rem .85rem;border-radius:999px;font:700 .84rem var(--f-texto);color:#fff;background:var(--c,#14213d);white-space:nowrap;box-shadow:0 1px 3px rgba(20,33,61,.12);letter-spacing:.01em}
.badge-carrera.dark-text{color:var(--tinta)}
.tabla-vacia{text-align:center;padding:1.5rem;color:var(--suave);font-style:italic}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:.98rem}
th,td{text-align:left;padding:.65rem .9rem;border-top:1px solid var(--borde)}
thead th{background:var(--tinta);color:#fff;border-top:0}
tbody tr:nth-child(even){background:var(--fondo)}
.enlace{display:flex;align-items:center;justify-content:center;width:fit-content;max-width:100%;min-height:44px;margin:1rem auto 0;padding:.5rem 1.4rem;background:var(--tinta);color:#fff;border-radius:999px;font-weight:700;text-decoration:none;text-align:center;transition:transform .28s cubic-bezier(.34,1.5,.64,1),background-color .2s ease,color .2s ease,box-shadow .28s ease}
.enlace:hover{transform:translateY(-4px) scale(1.03);background:var(--celeste);color:var(--tinta);box-shadow:0 8px 20px rgba(20,33,61,.2)}

/* Filtro General de Avisos por Carrera */
.avisos-filtro-wrap{margin:1.4rem 0 1.75rem;padding:1.15rem 1.4rem;background:linear-gradient(135deg,rgba(255,255,255,0.98),rgba(240,244,248,0.92));border:2px solid var(--borde);border-radius:14px;box-shadow:0 4px 16px rgba(20,33,61,.06);transition:border-color .2s ease}
.avisos-filtro-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:.85rem}
.avisos-filtro-title{display:inline-flex;align-items:center;gap:.45rem;font:800 1.05rem var(--f-titulo);color:var(--tinta);margin:0}
.avisos-filtro-incluir{display:inline-flex;align-items:center;gap:.45rem;font:600 .86rem var(--f-texto);color:var(--suave);cursor:pointer;user-select:none;transition:color .2s ease}
.avisos-filtro-incluir:hover{color:var(--tinta)}
.avisos-filtro-incluir input{accent-color:var(--celeste);cursor:pointer;width:17px;height:17px}
.avisos-filtro-chips{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center}
.chip-filtro{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem 1rem;border-radius:999px;font:700 .88rem var(--f-texto);border:1.5px solid var(--borde);background:#fff;color:var(--tinta);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.5,.64,1),border-color .2s ease,box-shadow .2s ease,background-color .2s ease,color .2s ease;box-shadow:0 1px 4px rgba(20,33,61,.04);user-select:none}
.chip-filtro:hover{transform:translateY(-2px);border-color:var(--c-chip,var(--celeste));box-shadow:0 4px 12px rgba(20,33,61,.1)}
.chip-filtro.active{background:var(--c-chip,var(--tinta));color:#fff;border-color:var(--c-chip,var(--tinta));box-shadow:0 4px 14px rgba(20,33,61,.22);transform:scale(1.02)}
.chip-filtro.active.dark-text{color:var(--tinta)}
.chip-filtro-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 .4rem;border-radius:999px;font-size:.76rem;background:rgba(20,33,61,.08);color:inherit}
.chip-filtro.active .chip-filtro-count{background:rgba(255,255,255,.28);color:#fff}
.chip-filtro.active.dark-text .chip-filtro-count{background:rgba(20,33,61,.15);color:var(--tinta)}
.avisos-filtro-resultado{margin-top:.8rem;padding-top:.7rem;border-top:1px solid rgba(20,33,61,.08);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;font-size:.86rem;color:var(--suave)}
.btn-limpiar-filtro{background:none;border:none;color:var(--alerta,#b3261e);font-weight:700;cursor:pointer;text-decoration:underline;padding:0;font-size:.86rem}
.btn-limpiar-filtro:hover{color:#8f1d16}

/* Oferta */
.oferta{background:var(--celeste-suave)}
.cards{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr))}
.card{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:1.25rem;align-items:stretch;background:var(--papel);border:1px solid var(--borde);border-top:8px solid var(--c,var(--celeste));border-radius:var(--radio);padding:1.4rem;transition:transform .28s cubic-bezier(.34,1.5,.64,1),box-shadow .28s ease,border-color .25s ease}
.card:hover{transform:translateY(-6px);border-color:var(--c,var(--tinta));box-shadow:0 12px 28px rgba(20,33,61,.14),0 0 0 1px var(--c,var(--celeste))}
.card:hover .carousel-slide img,.card:hover .carousel-slide svg{transform:scale(1.05)}
.card-info{display:flex;flex-direction:column;justify-content:space-between;gap:.75rem}
.card h3{margin:0;font:800 1.3rem/1.18 var(--f-titulo)}
.card h3 a{text-decoration:none;color:var(--tinta);transition:color .2s ease}
.card h3 a:hover{color:var(--c,var(--celeste))}
.card p{margin:0;color:var(--suave);font-size:.95rem}

/* Carrusel dentro de la card */
.card-carousel-box{position:relative;width:100%;min-height:170px;border-radius:8px;overflow:hidden;background:var(--tinta);box-shadow:0 3px 10px rgba(20,33,61,.15);display:flex}
.carousel-track{position:relative;width:100%;height:100%;min-height:170px;overflow:hidden}
.carousel-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,transform .45s ease;transform:scale(1.03)}
.carousel-slide.active{opacity:1;visibility:visible;transform:scale(1)}
.carousel-slide img,.carousel-slide svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.carousel-nav{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 .3rem;pointer-events:none;z-index:3}
.carousel-btn{pointer-events:auto;background:rgba(20,33,61,.7);backdrop-filter:blur(3px);color:#fff;border:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;cursor:pointer;transition:all .2s ease;opacity:.85}
.carousel-btn:hover{background:var(--sol);color:var(--tinta);opacity:1;transform:scale(1.1)}
.carousel-dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:4;pointer-events:none}
.carousel-dot{pointer-events:auto;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;cursor:pointer;transition:all .25s ease}
.carousel-dot.active{background:var(--sol);width:16px;border-radius:999px}

/* Hero actions y botón de comunidad */
.hero-actions{margin-top:1.6rem;display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap}
.btn-comunidad-hero{display:inline-flex;align-items:center;gap:.45rem;min-height:48px;padding:.55rem 1.45rem;background:var(--sol);color:var(--tinta);font:800 1rem var(--f-titulo);text-decoration:none;border-radius:999px;box-shadow:0 4px 14px rgba(246,180,14,.35);transition:transform .28s cubic-bezier(0.2,0.8,0.25,1),box-shadow .28s cubic-bezier(0.2,0.8,0.25,1),background-color .22s ease}
.btn-comunidad-hero:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(246,180,14,.45);background:#ffc324}
.btn-hero-icon{width:22px;height:22px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.btn-inscripcion-hero{display:inline-flex;align-items:center;gap:.55rem;min-height:48px;padding:.55rem 1.35rem;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.6);font:700 .95rem var(--f-texto);text-decoration:none;border-radius:999px;transition:transform .28s cubic-bezier(0.2,0.8,0.25,1),box-shadow .28s cubic-bezier(0.2,0.8,0.25,1),background-color .22s ease,color .22s ease,border-color .22s ease}
.btn-inscripcion-hero:hover{background:#fff;color:var(--tinta);border-color:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,33,61,.18)}

/* Movilidad en botones y cards */
nav a:focus-visible,.enlace:focus-visible{transform:translateY(-4px)}
.card:focus-within{transform:translateY(-4px);border-color:var(--tinta);box-shadow:0 8px 20px rgba(20,33,61,.15)}
nav a:active,.enlace:active{transform:translateY(1px) scale(.96);box-shadow:none}
.card:active{transform:scale(.98)}

/* Celulares: sin scroll horizontal, tablas apiladas */
@media(max-width:640px){
  body{font-size:1rem}
  main section{padding:2rem 0}
  .aviso{padding:1rem 1.1rem}
  .cards{grid-template-columns:1fr}
  .card{grid-template-columns:1fr;gap:1rem;padding:1.25rem}
  .card-carousel-box{min-height:190px}
  .tabla-wrap{overflow:visible;border:0}
  table,tbody,tr,td,caption{display:block;width:100%;min-width:0}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  caption{text-align:center;border-radius:8px}
  tr{margin:.6rem 0;overflow:hidden;background:var(--papel);border:1px solid var(--borde);border-radius:8px}
  tbody tr:nth-child(even){background:var(--papel)}
  td{display:grid;grid-template-columns:minmax(0,6.5rem) minmax(0,1fr);gap:.6rem;padding:.5rem .8rem;border-top:1px solid var(--borde)}
  td::before{content:attr(data-label);font-weight:700;color:var(--suave)}
  td:first-child{grid-template-columns:1fr;border-top:0;background:var(--celeste-suave);font-weight:700}
  td:first-child::before{content:none}
}

footer{background:var(--tinta);color:#dbe6f3;padding:2rem 0 max(2rem,calc(env(safe-area-inset-bottom) + 1rem));font-size:.98rem;text-align:center}
footer a{color:#fff}
footer p{margin:.2rem 0}
.error{background:#fff3f2;border:2px solid var(--alerta);border-radius:var(--radio);padding:1rem 1.25rem}

/* Modal y Planes de Estudio */
.oferta-acciones{margin-top:2.2rem;display:flex;justify-content:center}
.btn-plan-modal{border:none;cursor:pointer;font-size:1rem;background:var(--tinta);color:#fff;box-shadow:0 4px 14px rgba(20,33,61,.25)}
.card-btn-plan{display:inline-flex;align-items:center;gap:.3rem;margin-top:.75rem;font-size:.86rem;font-weight:700;color:var(--tinta);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0}
.card-btn-plan:hover{color:var(--celeste)}
.modal-dialog{border:none;border-radius:12px;padding:0;max-width:980px;width:min(95vw,980px);background:var(--papel);box-shadow:0 20px 45px rgba(20,33,61,.35);color:var(--texto)}
.modal-dialog::backdrop{background:rgba(20,33,61,.65);backdrop-filter:blur(3px)}
.modal-content{display:flex;flex-direction:column;max-height:88vh}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;background:var(--tinta);color:#fff;border-bottom:4px solid var(--c-active,var(--celeste))}
.modal-sub{margin:0 0 .2rem;font-size:.82rem;color:var(--celeste);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.modal-title{margin:0;font:800 1.35rem var(--f-titulo);color:#fff}
.modal-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;transition:background .2s ease}
.modal-close:hover{background:var(--sol);color:var(--tinta)}
.modal-body{padding:1.25rem 1.5rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.1rem}
.modal-tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tab-btn{padding:.5rem 1.1rem;border-radius:999px;border:2px solid var(--borde);background:var(--fondo);color:var(--tinta);font:700 .9rem var(--f-texto);cursor:pointer;transition:all .2s ease}
.tab-btn:hover{border-color:var(--tinta)}
.tab-btn.active{background:var(--c-tab,var(--tinta));color:#fff;border-color:var(--c-tab,var(--tinta))}
.modal-filters{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;background:var(--celeste-suave);padding:.75rem 1rem;border-radius:8px}
.filter-group{display:inline-flex;align-items:center;gap:.5rem;font-size:.88rem;font-weight:700;color:var(--tinta)}
.filter-search{flex:1;min-width:220px}
.input-search{width:100%;padding:.4rem .85rem;border:1px solid var(--borde);border-radius:999px;font:400 .9rem var(--f-texto);background:#fff;outline:none}
.input-search:focus{border-color:var(--tinta);box-shadow:0 0 0 2px var(--celeste)}
.modal-table-wrap{border:1px solid var(--borde);border-radius:8px;overflow-x:auto}
.badge-comision{display:inline-block;padding:.15rem .45rem;border-radius:4px;background:var(--celeste-suave);color:var(--tinta);font-weight:700;font-size:.78rem;margin-right:.2rem}
.badge-correlativa{display:inline-block;padding:.2rem .55rem;border-radius:6px;background:var(--fondo);border:1px solid var(--borde);font-size:.8rem;margin:.15rem .25rem .15rem 0;color:var(--texto)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
  nav a,.enlace,.card,.qr{transform:none!important}
}
</style>
</head>
<body>
<a class="saltar" href="#novedades">Saltar al contenido</a>

<header>
  <div class="wrap hero">
    <p class="tipo" id="h-tipo"></p>
    <h1 id="h-nombre" class="hero-logo-wrap">
      <img src="img/general/logo.png" alt="ISET N° 57" class="hero-logo" id="h-logo">
      <span class="sr-only">ISET N° 57</span>
    </h1>
    <p class="lema" id="h-lema"></p>
    <div class="hero-actions">
      <a href="comunidad.html" class="btn-comunidad-hero">🌟 Comunidad &amp; Blog de Carreras</a>
      <a href="inscripcion.html" class="btn-inscripcion-hero"><img src="img/general/inscripcion.png" alt="" class="btn-hero-icon"> Guía de Inscripción</a>
    </div>
    <nav aria-label="Secciones">
      <a href="#novedades">Novedades</a>
      <a href="#oferta">Oferta académica</a>
      <a href="comunidad.html">Comunidad</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <section id="novedades" aria-labelledby="t-nov">
    <div class="wrap">
      <h2 id="t-nov">Novedades</h2>
      <p class="intro" id="i-nov"></p>
      <div id="filtro-avisos" class="avisos-filtro-wrap" style="display:none"></div>
      <div class="avisos" id="avisos" aria-live="polite"><p>Cargando información…</p></div>
    </div>
  </section>

  <section id="oferta" class="oferta" aria-labelledby="t-of">
    <div class="wrap">
      <h2 id="t-of">Oferta académica</h2>
      <p class="intro" id="i-of"></p>
      <div class="cards" id="cards"></div>
      <div class="oferta-acciones">
        <button type="button" class="enlace btn-plan-modal" id="btn-abrir-plan">📋 Ver Planes de Estudio y Correlatividades</button>
      </div>
    </div>
  </section>
</main>

<dialog id="modal-plan" class="modal-dialog" aria-labelledby="modal-plan-title">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <p class="modal-sub">ISET N° 57 · Planes Oficiales</p>
        <h3 id="modal-plan-title" class="modal-title">Planes de Estudio y Correlatividades</h3>
      </div>
      <div class="modal-header-actions" id="modal-plan-header-actions" style="display:flex;align-items:center;gap:0.75rem">
        <button type="button" class="modal-close" id="btn-cerrar-modal" aria-label="Cerrar">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-tabs" id="plan-tabs"></div>
      <div class="modal-filters">
        <div class="filter-group">
          <label for="filtro-plan-anio">Año:</label>
          <select id="filtro-plan-anio" class="tabla-select">
            <option value="todos">Todos los años</option>
            <option value="1">1° Año</option>
            <option value="2">2° Año</option>
            <option value="3">3° Año</option>
          </select>
        </div>
        <div class="filter-group filter-search">
          <label for="filtro-plan-buscar">Buscar:</label>
          <input type="search" id="filtro-plan-buscar" class="input-search" placeholder="Materia o código (ej: Programación, 1INCOM)...">
        </div>
      </div>
      <div class="modal-table-wrap" id="modal-table-container"></div>
    </div>
  </div>
</dialog>

<footer id="contacto">
  <div class="wrap" id="pie"></div>
</footer>

<script>
(() => {
  "use strict";

  // Crea elementos de forma segura (todo texto entra como textContent, nunca como HTML)
  const h = (tag, attrs = {}, ...hijos) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") {
        n.className = v;
      } else if (k.startsWith("on") && typeof v === "function") {
        n.addEventListener(k.slice(2).toLowerCase(), v);
      } else {
        n.setAttribute(k, v);
      }
    }
    hijos.flat().forEach(c => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); });
    return n;
  };
  const $ = id => document.getElementById(id);
  const urlAbsoluta = ruta => new URL(ruta, document.baseURI).href;
  const normalizarUrl = url => {
    if (!url) return "";
    const u = String(url).trim();
    if (!u) return "";
    if (/^(https?:\/\/|mailto:|tel:|#|\/|\.\/|\.\.\/)/i.test(u)) return u;
    if (/\.html(\?.*)?(#.*)?$/i.test(u)) return u;
    return "https://" + u;
  };
  const esUrlExterna = url => {
    if (!url) return false;
    return /^https?:\/\//i.test(url) && !url.includes(window.location.host);
  };

  function buscarColorCarrera(nombreCarrera, espacios = []) {
    if (!nombreCarrera) return { color: "#14213d", darkText: false };
    const norm = String(nombreCarrera).toLowerCase().trim();
    const esp = espacios.find(e => {
      const t = (e.titulo || "").toLowerCase();
      const tc = (e.tituloCorto || "").toLowerCase();
      const id = (e.id || "").toLowerCase();
      return norm.includes(tc) || norm.includes(id) || t.includes(norm) || norm.includes(t);
    });
    const color = (esp && esp.color) ? esp.color : "#14213d";
    const darkText = color.toLowerCase() === "#f6b40e";
    return { color, darkText };
  }

  // Tabla interactiva: ordenada por Carrera y Fecha, con badges de color y filtro
  function tabla(t, d) {
    const espacios = (d && d.ofertaAcademica && d.ofertaAcademica.espacios) || [];
    const cols = t.columnas || [];
    const idxCarrera = cols.findIndex(c => c.toLowerCase().includes("carrera"));
    const idxFecha = cols.findIndex(c => c.toLowerCase().includes("fecha"));

    // Ordenar automáticamente por Carrera y luego por Fecha
    const filasOriginales = (t.filas || []).map(f => [...f]);
    filasOriginales.sort((a, b) => {
      if (idxCarrera !== -1) {
        const cA = String(a[idxCarrera] || "");
        const cB = String(b[idxCarrera] || "");
        const cmpC = cA.localeCompare(cB, "es", { sensitivity: "base" });
        if (cmpC !== 0) return cmpC;
      }
      if (idxFecha !== -1) {
        const fA = String(a[idxFecha] || "");
        const fB = String(b[idxFecha] || "");
        return fA.localeCompare(fB, "es", { sensitivity: "base" });
      }
      return 0;
    });

    const celda = (valor, colIdx) => {
      if (colIdx === idxCarrera) {
        const infoColor = buscarColorCarrera(valor, espacios);
        const spanClass = "badge-carrera" + (infoColor.darkText ? " dark-text" : "");
        return h("span", { class: spanClass, style: "--c:" + infoColor.color }, valor);
      }
      return valor;
    };

    const tbody = h("tbody");
    const renderFilas = (filas) => {
      if (!filas.length) {
        tbody.replaceChildren(
          h("tr", {}, h("td", { colspan: cols.length || 1, class: "tabla-vacia" }, "No hay materias programadas para la carrera seleccionada."))
        );
        return;
      }
      tbody.replaceChildren(
        ...filas.map(f =>
          h("tr", { "data-carrera": idxCarrera !== -1 ? String(f[idxCarrera]) : "" },
            f.map((c, i) => h("td", { "data-label": cols[i] }, celda(c, i)))
          )
        )
      );
    };

    renderFilas(filasOriginales);

    let toolbar = null;
    if (idxCarrera !== -1) {
      const carrerasUnicas = [...new Set(filasOriginales.map(f => String(f[idxCarrera]).trim()))].filter(Boolean);
      const select = h("select", { class: "tabla-select", "aria-label": "Filtrar por carrera" },
        h("option", { value: "todas" }, "Todas las carreras (" + filasOriginales.length + ")"),
        ...carrerasUnicas.map(c => {
          const count = filasOriginales.filter(f => String(f[idxCarrera]).trim() === c).length;
          return h("option", { value: c }, c + " (" + count + ")");
        })
      );

      select.addEventListener("change", (e) => {
        const sel = e.target.value;
        if (sel === "todas") {
          renderFilas(filasOriginales);
        } else {
          renderFilas(filasOriginales.filter(f => String(f[idxCarrera]).trim() === sel));
        }
      });

      toolbar = h("div", { class: "tabla-toolbar" },
        t.titulo ? h("h4", { class: "tabla-toolbar-title" }, t.titulo) : h("span"),
        h("div", { class: "tabla-filtro" },
          h("label", {}, "Carrera:"),
          select
        )
      );
    } else if (t.titulo) {
      toolbar = h("div", { class: "tabla-toolbar" },
        h("h4", { class: "tabla-toolbar-title" }, t.titulo)
      );
    }

    const tableEl = h("table", {},
      h("thead", {}, h("tr", {}, cols.map(c => h("th", { scope: "col" }, c)))),
      tbody
    );

    return h("div", { class: "tabla-wrap", role: "region", "aria-label": t.titulo || "Tabla", tabindex: "0" },
      toolbar,
      tableEl
    );
  }

  // "contenido" puede ser: string | array de strings (lista) | objeto tabla | array mixto
  function contenido(c, d) {
    if (typeof c === "string") {
      const trimmed = c.trim();
      if (!trimmed) return [];
      const paragraphs = trimmed.split(/\n+/).filter(Boolean);
      return paragraphs.map(p => h("p", {}, p));
    }
    if (Array.isArray(c)) {
      if (c.every(x => typeof x === "string")) return [h("ul", {}, c.map(x => h("li", {}, x)))];
      return c.flatMap(item => contenido(item, d));
    }
    if (c && c.columnas) return [tabla(c, d)];
    return [];
  }

  function obtenerTimestampAviso(a, indexOriginal = 0) {
    if (a) {
      if (a.fechaPublicacion) {
        const t = new Date(a.fechaPublicacion).getTime();
        if (!isNaN(t) && t > 0) return t;
      }
      if (a.creadoEn) {
        const t = new Date(a.creadoEn).getTime();
        if (!isNaN(t) && t > 0) return t;
      }
    }
    const base = 1792600000000;
    return base - ((indexOriginal || 0) * 3600000);
  }

  function formatearFechaAviso(fechaStr) {
    if (!fechaStr) return "";
    try {
      const d = new Date(fechaStr);
      if (isNaN(d.getTime())) return "";
      const dia = String(d.getDate()).padStart(2, "0");
      const mes = String(d.getMonth() + 1).padStart(2, "0");
      const anio = d.getFullYear();
      const hora = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${dia}/${mes}/${anio} ${hora}:${min} hs`;
    } catch (e) {
      return "";
    }
  }

  function resolverAviso(a, d) {
    const ig = d.inscripcionGeneral || {};
    if (a.tipo === "auto_inscripcion") {
      const p = (ig.periodos && ig.periodos[0]) || {};
      const reqList = (ig.requisitosComunes || []).map(r => typeof r === "string" ? r : r.item);
      const reqTxt = reqList.slice(0, 4).join(", ") + (reqList.length > 4 ? " y más." : ".");
      return {
        ...a,
        tipo: "fecha",
        espacioId: a.espacioId || "general",
        titulo: "Inscripciones ciclo lectivo " + (ig.ciclo || "2027"),
        contenido: (p.fechas ? p.fechas + ", " : "") + (p.horario ? p.horario + ", " : "") + "en Secretaría del Instituto. Presentar " + reqTxt,
        nota: a.nota || "Consultá el cronograma completo, etapas de febrero y requisitos detallados en la página de inscripción.",
        enlace: a.enlace || { texto: "Ver requisitos y fechas de inscripción", url: "inscripcion.html" },
        activo: a.activo !== false,
        fechaPublicacion: a.fechaPublicacion
      };
    }
    if (a.tipo === "auto_propedeutico") {
      const prop = ig.propedeutico || {};
      return {
        ...a,
        tipo: "info",
        espacioId: a.espacioId || "general",
        titulo: "Curso propedéutico",
        contenido: [
          prop.inicio ? "Inicio: " + prop.inicio : null,
          prop.modalidad ? "Modalidad: " + prop.modalidad : null,
          prop.duracion ? "Duración: " + prop.duracion : null,
          prop.nota || "Obligatorio para todas las tecnicaturas"
        ].filter(Boolean),
        nota: a.nota || null,
        enlace: a.enlace || null,
        activo: a.activo !== false,
        fechaPublicacion: a.fechaPublicacion
      };
    }
    return a;
  }

  function aviso(rawAviso, d, idx = 0) {
    const a = resolverAviso(rawAviso, d);
    const isApagado = a.activo === false;
    let badge = null;
    if (a.espacioId && a.espacioId !== "general" && d.ofertaAcademica && d.ofertaAcademica.espacios) {
      const espacio = d.ofertaAcademica.espacios.find(e => e.id === a.espacioId);
      if (espacio) {
        const bgCol = espacio.color || "var(--celeste)";
        const isYellow = bgCol.toLowerCase() === "#f6b40e";
        badge = h("span", {
          class: "badge-espacio",
          style: `background-color:${bgCol};color:${isYellow ? "#14213d" : "#fff"}`
        }, espacio.tituloCorto || espacio.titulo.replace(/^Tecnicatura Superior en\s+|^Tecnicatura en\s+/i, ""));
      }
    }

    const badgeEstado = isApagado
      ? h("span", {
          class: "badge-estado badge-apagado",
          title: "Aviso suspendido / apagado. Solo visible para administradores."
        }, "⏸️ Apagado (Oculto al público)")
      : null;

    const fechaFormateada = a.fechaPublicacion ? formatearFechaAviso(a.fechaPublicacion) : "";
    const badgeFecha = fechaFormateada
      ? h("span", {
          class: "badge-fecha",
          title: "Fecha de publicación: " + fechaFormateada
        }, "🕒 " + fechaFormateada)
      : null;

    const iconoAnuncio = h("img", {
      src: "img/general/anuncio.png",
      alt: "Anuncio",
      class: "aviso-icono",
      loading: "lazy"
    });

    const imgEl = a.imagen ? h("div", { class: "aviso-img-wrap" },
      h("img", {
        src: a.imagen,
        alt: a.titulo || "Imagen de aviso",
        class: "aviso-img",
        loading: "lazy",
        onclick: () => {
          if (a.imagen) window.open(a.imagen, "_blank");
        }
      })
    ) : null;

    let enlaceEl = null;
    if (a.enlace && a.enlace.url) {
      const urlNorm = normalizarUrl(a.enlace.url);
      const isExt = esUrlExterna(urlNorm);
      enlaceEl = h("a", {
        class: "enlace",
        href: urlNorm,
        target: isExt ? "_blank" : null,
        rel: isExt ? "noopener noreferrer" : null
      }, a.enlace.texto || "Más información");
    }

    return h("article", {
      class: "aviso " + (a.tipo || "info") + (isApagado ? " aviso-apagado" : ""),
      "data-aviso-idx": String(idx)
    },
      h("div", { class: "aviso-header" },
        iconoAnuncio,
        badge,
        badgeFecha,
        badgeEstado,
        h("h3", {}, a.titulo)
      ),
      imgEl,
      contenido(a.contenido, d),
      a.nota ? h("p", { class: "nota" }, a.nota) : null,
      enlaceEl
    );
  }

  function setupModalPlanes(espacios) {
    const dialog = $("modal-plan");
    const btnAbrir = $("btn-abrir-plan");
    const btnCerrar = $("btn-cerrar-modal");
    const tabsContainer = $("plan-tabs");
    const selectAnio = $("filtro-plan-anio");
    const inputBuscar = $("filtro-plan-buscar");
    const tableContainer = $("modal-table-container");

    const carrerasConMaterias = espacios.filter(e => e.materiasDetalladas && e.materiasDetalladas.length);
    if (!carrerasConMaterias.length) {
      if (btnAbrir) btnAbrir.style.display = "none";
      return;
    }

    let activeCareerId = carrerasConMaterias[0].id;

    function renderTabs() {
      dialog.setAttribute("data-active-career", activeCareerId);
      tabsContainer.replaceChildren(...carrerasConMaterias.map(c => {
        const btn = h("button", {
          type: "button",
          class: "tab-btn" + (c.id === activeCareerId ? " active" : ""),
          "data-carrera": c.id,
          style: "--c-tab:" + (c.color || "var(--tinta)")
        }, c.tituloCorto || c.titulo.replace(/^Tecnicatura Superior en\s+/i, ""));
        btn.addEventListener("click", () => {
          activeCareerId = c.id;
          dialog.setAttribute("data-active-career", activeCareerId);
          renderTabs();
          renderTabla();
          if (window.ISET_EDITOR_UI && typeof window.ISET_EDITOR_UI.refreshPills === "function") {
            window.ISET_EDITOR_UI.refreshPills();
          }
        });
        return btn;
      }));
    }

    function renderTabla() {
      const currentEsp = carrerasConMaterias.find(e => e.id === activeCareerId) || carrerasConMaterias[0];
      dialog.style.setProperty("--c-active", currentEsp.color || "var(--celeste)");

      const anioFiltro = selectAnio.value;
      const busqueda = (inputBuscar.value || "").toLowerCase().trim();

      let materias = currentEsp.materiasDetalladas || [];

      if (anioFiltro !== "todos") {
        materias = materias.filter(m => String(m.anio).trim() === anioFiltro);
      }

      if (busqueda) {
        materias = materias.filter(m => 
          (m.nombre && m.nombre.toLowerCase().includes(busqueda)) ||
          (m.codigo && m.codigo.toLowerCase().includes(busqueda)) ||
          (m.correlativas && m.correlativas.some(cr => cr.toLowerCase().includes(busqueda)))
        );
      }

      if (!materias.length) {
        tableContainer.replaceChildren(
          h("div", { class: "tabla-vacia" }, "No se encontraron materias con los filtros seleccionados.")
        );
        return;
      }

      const thead = h("thead", {},
        h("tr", {},
          h("th", { scope: "col" }, "Año"),
          h("th", { scope: "col" }, "Cód."),
          h("th", { scope: "col" }, "Materia"),
          h("th", { scope: "col" }, "Horas"),
          h("th", { scope: "col" }, "Comisiones"),
          h("th", { scope: "col" }, "Correlatividades Previas")
        )
      );

      const tbody = h("tbody", {},
        materias.map(m => {
          const comisionesBadges = (m.comisiones && m.comisiones.length)
            ? m.comisiones.map(com => {
                const doc = (m.docentes && m.docentes[com]) ? m.docentes[com] : "";
                if (doc) {
                  return h("span", { class: "badge-comision", title: "Docente: " + doc },
                    h("strong", {}, "Com. " + com + ": "),
                    doc
                  );
                }
                return h("span", { class: "badge-comision" }, "Com. " + com);
              })
            : h("span", { style: "color:var(--suave)" }, "—");

          const correlativasBadges = (m.correlativas && m.correlativas.length)
            ? m.correlativas.map(corr => h("span", { class: "badge-correlativa" }, corr))
            : h("span", { style: "color:var(--suave);font-size:.84rem" }, "Sin correlativas");

          return h("tr", {},
            h("td", { "data-label": "Año", style: "font-weight:700" }, m.anio + "°"),
            h("td", { "data-label": "Código", style: "font-family:monospace;font-weight:700;color:var(--suave)" }, m.codigo || "—"),
            h("td", { "data-label": "Materia", style: "font-weight:700;color:var(--tinta)" }, m.nombre),
            h("td", { "data-label": "Carga Horaria" }, (m.cargaHoraria ? m.cargaHoraria + " mód." : "—")),
            h("td", { "data-label": "Comisiones" }, comisionesBadges),
            h("td", { "data-label": "Correlativas" }, correlativasBadges)
          );
        })
      );

      tableContainer.replaceChildren(
        h("table", {}, thead, tbody)
      );
    }

    if (btnAbrir) {
      btnAbrir.onclick = () => {
        renderTabs();
        renderTabla();
        dialog.showModal();
        if (window.ISET_EDITOR_UI && typeof window.ISET_EDITOR_UI.refreshPills === "function") {
          window.ISET_EDITOR_UI.refreshPills();
        }
      };
    }

    if (btnCerrar) {
      btnCerrar.onclick = () => dialog.close();
    }

    dialog.onclick = (e) => {
      if (e.target === dialog) dialog.close();
    };

    selectAnio.onchange = renderTabla;
    inputBuscar.oninput = renderTabla;

    window.abrirModalPlanCarrera = (carreraId) => {
      if (carrerasConMaterias.some(c => c.id === carreraId)) {
        activeCareerId = carreraId;
      }
      renderTabs();
      renderTabla();
      dialog.showModal();
      if (window.ISET_EDITOR_UI && typeof window.ISET_EDITOR_UI.refreshPills === "function") {
        window.ISET_EDITOR_UI.refreshPills();
      }
    };
  }

  function crearCarrusel(imagenes = [], color = "#74acdf", enlace = "#") {
    const box = h("div", { class: "card-carousel-box", style: "--c-car:" + color });
    
    // Si no hay imágenes configuradas, provee una por defecto
    if (!imagenes.length) {
      imagenes = [{ src: "img/carrera/td/carrusel/1.svg", alt: "ISET N° 57" }];
    }

    const track = h("div", { class: "carousel-track" });
    const slides = imagenes.map((imgObj, idx) => {
      const src = typeof imgObj === "string" ? imgObj : imgObj.src;
      const alt = (typeof imgObj === "object" && imgObj.alt) ? imgObj.alt : "Foto institucional";
      const slide = h("div", { 
        class: "carousel-slide" + (idx === 0 ? " active" : ""), 
        "data-index": idx,
        role: "group",
        "aria-label": `${idx + 1} de ${imagenes.length}: ${alt}`
      },
        h("a", { href: enlace, title: "Ver carrera: " + alt, style: "display:block;width:100%;height:100%" },
          h("img", { src: src, alt: alt, loading: "lazy" })
        )
      );
      return slide;
    });
    track.append(...slides);

    let currentIndex = 0;
    let timer = null;
    let dots = [];

    const irA = (n) => {
      currentIndex = (n + imagenes.length) % imagenes.length;
      slides.forEach((s, i) => s.classList.toggle("active", i === currentIndex));
      dots.forEach((d, i) => d.classList.toggle("active", i === currentIndex));
    };

    const siguiente = () => irA(currentIndex + 1);
    const anterior = () => irA(currentIndex - 1);

    const iniciarAuto = () => {
      if (imagenes.length > 1 && !timer) {
        timer = setInterval(siguiente, 4500);
      }
    };
    const pausarAuto = () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    };

    box.addEventListener("mouseenter", pausarAuto);
    box.addEventListener("mouseleave", iniciarAuto);
    box.addEventListener("focusin", pausarAuto);
    box.addEventListener("focusout", iniciarAuto);

    box.append(track);

    if (imagenes.length > 1) {
      const btnPrev = h("button", {
        type: "button",
        class: "carousel-btn",
        "aria-label": "Foto anterior",
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); anterior(); }
      }, "❮");

      const btnNext = h("button", {
        type: "button",
        class: "carousel-btn",
        "aria-label": "Foto siguiente",
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); siguiente(); }
      }, "❯");

      const nav = h("div", { class: "carousel-nav" }, btnPrev, btnNext);
      box.append(nav);

      const dotsWrap = h("div", { class: "carousel-dots" });
      dots = imagenes.map((_, idx) => h("button", {
        type: "button",
        class: "carousel-dot" + (idx === 0 ? " active" : ""),
        "aria-label": `Ir a foto ${idx + 1}`,
        onclick: (e) => { e.preventDefault(); e.stopPropagation(); irA(idx); }
      }));
      dotsWrap.append(...dots);
      box.append(dotsWrap);

      iniciarAuto();
    }

    return box;
  }

  function card(c) {
    const destino = c.enlace;
    const btnPlan = (c.materiasDetalladas && c.materiasDetalladas.length)
      ? h("button", {
          type: "button",
          class: "card-btn-plan",
          onclick: (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (window.abrirModalPlanCarrera) window.abrirModalPlanCarrera(c.id);
          }
        }, "📋 Ver correlatividades")
      : null;

    const carruselElem = crearCarrusel(c.carrusel || [], c.color, destino);

    const info = h("div", { class: "card-info" },
      h("div", {},
        h("h3", {}, h("a", { href: destino }, c.titulo)),
        h("p", {}, c.descripcion)
      ),
      h("div", {},
        btnPlan
      )
    );

    const art = h("article", { class: "card", style: c.color ? "--c:" + c.color : null },
      info,
      carruselElem
    );
    return art;
  }

  let filtroCarreraActivo = "todos";
  let incluirGenerales = true;

  function coincideFiltroCarrera(a, filtroId, incGenerales, espacios = []) {
    if (filtroId === "todos") return true;

    const avisoEspacio = a.espacioId || "general";

    if (filtroId === "general") {
      return avisoEspacio === "general";
    }

    // Coincidencia directa por espacioId
    if (avisoEspacio === filtroId) return true;

    // Coincidencia si el aviso contiene tablas con filas para esa carrera (ej: Mesas de Examen)
    if (a.contenido && a.contenido.filas && Array.isArray(a.contenido.filas)) {
      const currentEsp = espacios.find(e => e.id === filtroId);
      const espTitulo = currentEsp ? currentEsp.titulo.toLowerCase() : "";
      const espCorto = currentEsp && currentEsp.tituloCorto ? currentEsp.tituloCorto.toLowerCase() : "";
      const hasRow = a.contenido.filas.some(row => {
        const carreraRow = (row[1] || "").toLowerCase();
        if (!carreraRow) return false;
        if (carreraRow.includes(filtroId)) return true;
        if (espCorto && carreraRow.includes(espCorto)) return true;
        if (filtroId === "digital" && carreraRow.includes("digital")) return true;
        if (filtroId === "higiene" && (carreraRow.includes("higiene") || carreraRow.includes("seguridad"))) return true;
        if (filtroId === "enfermeria" && carreraRow.includes("enfermer")) return true;
        if (filtroId === "simulacion" && carreraRow.includes("simulac")) return true;
        return false;
      });
      if (hasRow) return true;
    }

    // Si está activada la opción de incluir avisos institucionales / generales
    if (incGenerales && avisoEspacio === "general") {
      return true;
    }

    return false;
  }

  function renderFiltroAvisos(d, avisosConMeta, canEdit) {
    const contenedor = $("filtro-avisos");
    if (!contenedor) return;

    const espacios = d.ofertaAcademica?.espacios || [];
    if (!espacios.length) {
      contenedor.style.display = "none";
      return;
    }

    // Avisos base para conteos
    const listaParaConteo = canEdit ? avisosConMeta : avisosConMeta.filter(item => item.aviso.activo !== false);

    // Opciones de filtro
    const opciones = [
      { id: "todos", label: "🌟 Todos los anuncios", color: "var(--tinta)" },
      { id: "general", label: "🏛️ Institucional", color: "var(--celeste)" }
    ];

    espacios.forEach(esp => {
      const label = esp.tituloCorto || esp.titulo.replace(/^Tecnicatura Superior en\s+|^Tecnicatura en\s+/i, "");
      opciones.push({
        id: esp.id,
        label: `🎓 ${label}`,
        nombreLargo: esp.titulo,
        color: esp.color || "var(--celeste)",
        isDark: (esp.color || "").toLowerCase() === "#f6b40e"
      });
    });

    const chipsElements = opciones.map(op => {
      const count = listaParaConteo.filter(item => {
        return coincideFiltroCarrera(item.aviso, op.id, false, espacios);
      }).length;

      const isActive = filtroCarreraActivo === op.id;
      const chip = h("button", {
        type: "button",
        class: `chip-filtro ${isActive ? "active" : ""} ${op.isDark && isActive ? "dark-text" : ""}`,
        style: `--c-chip:${op.color}`,
        "data-filtro-id": op.id,
        "aria-pressed": isActive ? "true" : "false",
        title: `Filtrar por ${op.label} (${count} anuncios)`,
        onclick: (e) => {
          e.preventDefault();
          filtroCarreraActivo = op.id;
          render(d);
          if (window.ISET_EDITOR_UI && typeof window.ISET_EDITOR_UI.refreshPills === "function") {
            window.ISET_EDITOR_UI.refreshPills();
          }
        }
      },
        h("span", {}, op.label),
        h("span", { class: "chip-filtro-count" }, String(count))
      );
      return chip;
    });

    const isCarreraEspecifica = filtroCarreraActivo !== "todos" && filtroCarreraActivo !== "general";
    const headerTitle = h("h3", { class: "avisos-filtro-title" },
      h("span", { style: "font-size:1.15rem" }, "🎯"),
      "Filtrar anuncios por carrera:"
    );

    const checkGenerales = h("label", {
      class: "avisos-filtro-incluir",
      title: "Si está marcado, también muestra anuncios institucionales y generales junto a los de la carrera seleccionada"
    },
      h("input", {
        type: "checkbox",
        checked: incluirGenerales,
        onchange: (e) => {
          incluirGenerales = e.target.checked;
          render(d);
          if (window.ISET_EDITOR_UI && typeof window.ISET_EDITOR_UI.refreshPills === "function") {
            window.ISET_EDITOR_UI.refreshPills();
          }
        }
      }),
      h("span", {}, "Incluir avisos generales e institucionales")
    );

    const header = h("div", { class: "avisos-filtro-header" },
      headerTitle,
      isCarreraEspecifica ? checkGenerales : null
    );

    const chipsWrap = h("div", { class: "avisos-filtro-chips" }, ...chipsElements);

    let feedback = null;
    if (filtroCarreraActivo !== "todos") {
      const activeOp = opciones.find(o => o.id === filtroCarreraActivo);
      const nombreFiltro = activeOp ? activeOp.label : filtroCarreraActivo;
      feedback = h("div", { class: "avisos-filtro-resultado" },
        h("span", {},
          "Mostrando anuncios para: ",
          h("strong", { style: "color:var(--tinta)" }, nombreFiltro),
          incluirGenerales && isCarreraEspecifica ? " (incluyendo comunicados generales)" : ""
        ),
        h("button", {
          type: "button",
          class: "btn-limpiar-filtro",
          onclick: (e) => {
            e.preventDefault();
            filtroCarreraActivo = "todos";
            render(d);
            if (window.ISET_EDITOR_UI && typeof window.ISET_EDITOR_UI.refreshPills === "function") {
              window.ISET_EDITOR_UI.refreshPills();
            }
          }
        }, "✖ Quitar filtro (Ver todos)")
      );
    }

    contenedor.style.display = "block";
    contenedor.replaceChildren(header, chipsWrap, feedback);
  }

  function render(d) {
    window.__iset_lastData = d;
    const i = d.institucion, g = d.informacionGeneral, o = d.ofertaAcademica;
    document.title = i.nombre + (i.nombreLargo ? " – " + i.nombreLargo : "");
    if ($("h-logo")) $("h-logo").alt = i.nombre + (i.nombreLargo ? " – " + i.nombreLargo : "");
    $("h-tipo").textContent = i.nombreLargo || "";
    $("h-lema").textContent = i.lema || "";
    $("t-nov").textContent = g.titulo || "Novedades";
    $("i-nov").textContent = g.introduccion || "";

    const canEdit = Boolean(window.ISET_AUTH && window.ISET_AUTH.canEdit && window.ISET_AUTH.canEdit());
    const rawAvisos = g.avisos || [];
    const avisosConMeta = rawAvisos.map((a, idx) => ({
      aviso: a,
      originalIdx: idx,
      timestamp: obtenerTimestampAviso(a, idx)
    }));

    // Ordenar por orden de llegada: el más nuevo en la parte superior (timestamp descendente)
    avisosConMeta.sort((a, b) => b.timestamp - a.timestamp);

    // Barra de filtro general por carrera (bien visible)
    renderFiltroAvisos(d, avisosConMeta, canEdit);

    const avisosPorPermiso = canEdit
      ? avisosConMeta
      : avisosConMeta.filter(item => item.aviso.activo !== false);

    const avisosAMostrar = avisosPorPermiso.filter(item => {
      return coincideFiltroCarrera(item.aviso, filtroCarreraActivo, incluirGenerales, o.espacios || []);
    });

    if (avisosAMostrar.length) {
      $("avisos").replaceChildren(...avisosAMostrar.map(item => aviso(item.aviso, d, item.originalIdx)));
    } else {
      const activeOp = (o.espacios || []).find(e => e.id === filtroCarreraActivo);
      const nombreCarrera = activeOp ? (activeOp.tituloCorto || activeOp.titulo) : "esta carrera";
      $("avisos").replaceChildren(
        h("div", { class: "tabla-vacia", style: "padding:2.5rem 1rem" },
          h("div", { style: "font-size:2.2rem;margin-bottom:0.6rem" }, "📭"),
          h("strong", { style: "display:block;font-size:1.1rem;color:var(--tinta);margin-bottom:0.4rem" },
            `No hay novedades específicas para ${nombreCarrera} en este momento.`
          ),
          h("p", { style: "color:var(--suave);margin:0 auto 1.25rem;max-width:55ch" },
            "Podés consultar las novedades de otras carreras o volver a ver todos los anuncios."
          ),
          h("button", {
            type: "button",
            class: "enlace",
            style: "cursor:pointer;border:none",
            onclick: () => {
              filtroCarreraActivo = "todos";
              render(d);
              if (window.ISET_EDITOR_UI && typeof window.ISET_EDITOR_UI.refreshPills === "function") {
                window.ISET_EDITOR_UI.refreshPills();
              }
            }
          }, "🌟 Ver todos los anuncios")
        )
      );
    }

    $("t-of").textContent = o.titulo || "Oferta académica";
    $("i-of").textContent = o.introduccion || "";
    $("cards").replaceChildren(...o.espacios.map(card));
    setupModalPlanes(o.espacios);
    const c = i.contacto || {};
    $("pie").replaceChildren(
      h("p", {}, h("strong", {}, i.nombre + " · " + (i.gestion || ""))),
      c.direccion ? h("p", {}, c.direccion) : null,
      c.telefono ? h("p", {}, "Tel.: " + c.telefono) : null,
      c.email ? h("p", {}, "Correo: ", h("a", { href: "mailto:" + c.email }, c.email)) : null,
      c.horario ? h("p", {}, "Atención: " + c.horario) : null
    );
  }

  window.__iset_render = render;

  const loadInitialData = () => {
    if (window.ISET_CONTENT && window.ISET_CONTENT.data) {
      render(window.ISET_CONTENT.data);
    } else {
      Promise.all([
        fetch("data.json?_t=" + Date.now(), { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
        fetch("materias.json?_t=" + Date.now(), { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null)
      ])
        .then(([data, materias]) => {
          if (materias && data && data.ofertaAcademica && data.ofertaAcademica.espacios) {
            data.ofertaAcademica.espacios.forEach(esp => {
              if (materias[esp.id]) esp.materiasDetalladas = materias[esp.id];
            });
          }
          render(data);
        })
        .catch(err => {
          console.error(err);
          $("avisos").replaceChildren(h("div", { class: "error", role: "alert" },
            "No pudimos cargar la información. Probá recargar la página en unos minutos."));
        });
    }
  };

  loadInitialData();
  window.addEventListener("iset:content-loaded", (e) => {
    if (e.detail && e.detail.data) render(e.detail.data);
  });
  window.addEventListener("iset:content-updated", (e) => {
    if (e.detail && e.detail.data) render(e.detail.data);
  });
})();
</script>
