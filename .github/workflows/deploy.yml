name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar que data.json sea un JSON correcto
        run: python3 -m json.tool data.json > /dev/null

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='README.md' ./ dist/
          touch dist/.nojekyll

      - name: Inyectar credenciales de Supabase en producción (GitHub Secrets)
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const url = (process.env.SECRET_SUPABASE_URL || "").trim();
            const key = (process.env.SECRET_SUPABASE_ANON_KEY || "").trim();
            if (url && key) {
              const file = "dist/js/auth/config.js";
              let content = fs.readFileSync(file, "utf8");
              content = content.replace("PRODUCTION_SUPABASE_URL = \"\"", "PRODUCTION_SUPABASE_URL = \"" + url + "\"");
              content = content.replace("PRODUCTION_SUPABASE_ANON_KEY = \"\"", "PRODUCTION_SUPABASE_ANON_KEY = \"" + key + "\"");
              fs.writeFileSync(file, content, "utf8");
              console.log("✅ Credenciales de Supabase inyectadas correctamente en dist/js/auth/config.js");
            } else {
              console.log("ℹ️ No se detectaron secretos SUPABASE_URL / SUPABASE_ANON_KEY en GitHub Secrets. Se usarán las credenciales configuradas en config.js.");
            }
          '

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
