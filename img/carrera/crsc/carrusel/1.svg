<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e24aa" />
      <stop offset="100%" stop-color="#5e35b1" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grad)" rx="12" />
  <rect width="600" height="400" fill="url(#grid)" rx="12" />
  <circle cx="500" cy="80" r="120" fill="rgba(255,255,255,0.06)" />
  <circle cx="100" cy="320" r="80" fill="rgba(255,255,255,0.04)" />
  
  <g transform="translate(300, 160)" text-anchor="middle">
    <text font-size="64" y="0">🔬</text>
    <text font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="bold" fill="#ffffff" y="60">Centro de Simulación Clínica</text>
    <text font-family="'Atkinson Hyperlegible', sans-serif" font-size="15" fill="rgba(255,255,255,0.85)" y="90">Entrenamiento de Alta Fidelidad</text>
  </g>
</svg>